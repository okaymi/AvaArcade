<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ava 的粉紅遊戲小天地 🐾</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 背景粉紅波點設計 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #ffb6c1;
            background-image: radial-gradient(#ff69b4 15%, transparent 16%), radial-gradient(#ff69b4 15%, transparent 16%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 頂部導航列 */
        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ff1493;
            text-decoration: none;
        }

        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #d81b60;
            font-weight: 600;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ff69b4;
        }

        /* 主要內容區 */
        main {
            flex: 1;
            max-width: 1000px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }

        /* 閃動效果動畫 */
        @keyframes blink-animation {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.02); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* 標題白框、粉紅字、閃動效果 */
        .hero h1 {
            display: inline-block;
            background: #ffffff;
            color: #ff1493;
            padding: 18px 30px;
            border-radius: 20px;
            border: 4px solid #ff69b4;
            font-size: 2.2rem;
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.3);
            animation: blink-animation 1.8s infinite ease-in-out;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 1.1rem;
            color: #ffffff;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
            font-weight: bold;
            margin-bottom: 40px;
        }

        /* 遊戲選單格子 */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            padding: 10px;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #ffc0cb;
        }

        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(255, 105, 180, 0.3);
            border-color: #ff69b4;
        }

        .game-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .game-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #d81b60;
            margin-bottom: 10px;
        }

        .game-desc {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 20px;
        }

        .play-btn {
            background: #ff69b4;
            color: white;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: background 0.3s;
        }

        .game-card:hover .play-btn {
            background: #ff1493;
        }

        /* 專門比吉他/To Be Continued 遊戲卡片設計（全白風格） */
        .game-card.coming-soon {
            background: #ffffff;
            border: 2px dashed #ffb6c1;
            cursor: default;
        }

        .game-card.coming-soon:hover {
            transform: none;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.15);
            border-color: #ffb6c1;
        }

        .game-card.coming-soon .play-btn {
            background: #f0f0f0;
            color: #999;
        }

        .game-card.coming-soon:hover .play-btn {
            background: #f0f0f0;
        }

        /* 頁腳 */
        footer {
            text-align: center;
            padding: 20px;
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            font-size: 0.9rem;
            background: rgba(255, 182, 193, 0.8);
        }
    </style>
</head>
<body>

    <!-- 頂部標題與 Links -->
    <header>
        <a href="index.html" class="logo">🐶 Ava's Arcade 🐱</a>
        <nav>
            <a href="index.html">首頁</a>
            <a href="#games">遊戲列表</a>
            <a href="https://github.com" target="_blank">GitHub</a>
        </nav>
    </header>

    <!-- 網頁主體 -->
    <main>
        <div class="hero">
            <h1>🐶 歡迎嚟到我嘅 HTML 遊戲小天地 🐱</h1>
            <p>✨ 呢度有我親手整嘅唔同小遊戲，快啲揀一個黎玩下啦～ ✨</p>
        </div>

        <!-- 遊戲選擇按鈕 / 卡片區域 -->
        <div class="game-grid" id="games">
            <!-- 遊戲 1：彩虹橋寵物心靈連線 -->
            <a href="AvaArcade/RainbowBridge.html" class="game-card">
                <div class="game-icon">🐕‍🦺</div>
                <div class="game-title">彩虹橋</div>
                <div class="game-desc">彩虹橋寵物心靈連線,你的AI寵物!</div>
                <div class="play-btn">立即遊玩</div>
            </a>

            <!-- 遊戲 2：To Be Continued -->
            <div class="game-card coming-soon">
                <div class="game-icon">⏳</div>
                <div class="game-title">To Be Continued</div>
                <div class="game-desc">敬請期待更多精彩小遊戲上架...</div>
                <div class="play-btn">To Be Continued</div>
            </div>

            <!-- 遊戲 3：To Be Continued -->
            <div class="game-card coming-soon">
                <div class="game-icon">🎁</div>
                <div class="game-title">To Be Continued</div>
                <div class="game-desc">敬請期待更多精彩小遊戲上架...</div>
                <div class="play-btn">To Be Continued</div>
            </div>
        </div>
    </main>

    <!-- 頁腳 -->
    <footer>
        <p>&copy; 2026 Ava. All rights reserved. 🐾</p>
    </footer>

</body>
</html>
